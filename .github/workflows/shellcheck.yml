name: ShellCheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # shellcheck is preinstalled on the ubuntu-latest runner image.
      # bin/*.csh is tcsh, which ShellCheck doesn't support
      # (sh/bash/dash/ksh only), so only *.sh is checked.
      - name: Run ShellCheck on bin/*.sh
        run: shellcheck bin/*.sh
