name: ShellCheck and tests

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # shellcheck is preinstalled on the ubuntu-latest runner image.
      # bin/*.csh is tcsh, which ShellCheck doesn't support
      # (sh/bash/dash/ksh only), so only *.sh files are checked.
      - name: Run ShellCheck on bin/*.sh and test/*.sh
        run: shellcheck bin/*.sh test/*.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run taritdate.sh tests
        run: sh test/taritdate_test.sh
